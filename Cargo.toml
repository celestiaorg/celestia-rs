[workspace]
resolver = "3"
members = [
    "crates/tier-0-primitives/crypto",
    "crates/tier-0-primitives/encoding",
    "crates/tier-0-primitives/hash",
    "crates/tier-0-primitives/math",
    "crates/tier-0-primitives/merkle",
    "crates/tier-1-protocol-types/abci-types",
    "crates/tier-1-protocol-types/celestia-core-proto",
    "crates/tier-1-protocol-types/celestia-proto",
    "crates/tier-1-protocol-types/cosmos-types",
    "crates/tier-1-protocol-types/nmt",
    "crates/tier-1-protocol-types/shares",
    "crates/tier-1-protocol-types/square",
    "crates/tier-1-protocol-types/tendermint-types",
    "crates/tier-2-state-and-store/iavl",
    "crates/tier-2-state-and-store/ics23-proofs",
    "crates/tier-2-state-and-store/kvstore",
    "crates/tier-2-state-and-store/multistore",
    "crates/tier-3-app-modules/ante",
    "crates/tier-3-app-modules/auth",
    "crates/tier-3-app-modules/bank",
    "crates/tier-3-app-modules/staking",
    "crates/tier-3-app-modules/sdk",
    "crates/tier-3-app-modules/x/auth",
    "crates/tier-3-app-modules/x/ante",
    "crates/tier-3-app-modules/x/bank",
    "crates/tier-3-app-modules/x/upgrade",
    "crates/tier-3-app-modules/x/consensus",
    "crates/tier-3-app-modules/x/circuit",
    "crates/tier-3-app-modules/x/blob",
    "crates/tier-3-app-modules/x/params",
    "crates/tier-3-app-modules/x/minfee",
    "crates/tier-3-app-modules/x/capability",
    "crates/tier-3-app-modules/x/ibc",
    "crates/tier-3-app-modules/x/transfer",
    "crates/tier-3-app-modules/x/icahost",
    "crates/tier-3-app-modules/x/packetforward",
    "crates/tier-3-app-modules/x/mint",
    "crates/tier-3-app-modules/x/fibre",
    "crates/tier-3-app-modules/x/hyperlane",
    "crates/tier-3-app-modules/x/warp",
    "crates/tier-3-app-modules/x/gov",
    "crates/tier-4-runtime/abci-server",
    "crates/tier-4-runtime/app",
    "crates/devnet-conformance",
    "crates/tier-5-node/celestia-rs",
    "crates/m1-integration",
    "crates/m2-integration",
    "crates/m3-integration",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rootulp/celestia-rs"
authors = ["Rootul Patel"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# New in clippy 1.99; `assert!(x.is_empty())` reads fine in tests.
assert_is_empty = "allow"
# Ported Go identifiers (InitChain, CometBFT, …) appear throughout docs.
doc_markdown = "allow"
# ABCI handlers take requests by value to mirror the protocol.
needless_pass_by_value = "allow"
# Keeper functions keep Result signatures uniform with their Go originals.
unnecessary_wraps = "allow"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Keep build directories small: several agent worktrees build concurrently
# inside one fixed disk allowance.
[profile.dev]
debug = "line-tables-only"
incremental = false
