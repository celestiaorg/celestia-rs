# libFuzzer targets (cargo-fuzz, nightly): their own workspace.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rootulp/celestia-rs"
authors = ["Rootul Patel"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# New in clippy 1.99; `assert!(x.is_empty())` reads fine in tests.
assert_is_empty = "allow"
# Ported Go identifiers (InitChain, CometBFT, …) appear throughout docs.
doc_markdown = "allow"
# ABCI handlers take requests by value to mirror the protocol.
needless_pass_by_value = "allow"
# Keeper functions keep Result signatures uniform with their Go originals.
unnecessary_wraps = "allow"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Keep build directories small: several agent worktrees build concurrently
# inside one fixed disk allowance.
[profile.dev]
debug = "line-tables-only"
incremental = false

# RocksDB's C++ build: optimized (tests replay many blocks through it) and
# without debug info (~1.7 GB of objects otherwise).
[profile.dev.package.librocksdb-sys]
opt-level = 2
debug = false

# Erasure coding of block parts runs on every proposal; keep it fast in
# the debug builds the devnets use.
[profile.dev.package.reed-solomon-erasure]
opt-level = 3

[profile.dev.package.reed-solomon-simd]
opt-level = 3

# Release (also `cargo test --release`, the followers, benchmarks). Two
# deliberate choices for a consensus node:
# - `panic = "unwind"` (the default, stated explicitly): nothing in the
#   state machine relies on catching panics (Go panics are ported as
#   errors), but a panic in a peer / RPC thread must only end that thread,
#   as Go's p2p recovers a peer goroutine's panic, not take the validator
#   down. A panic on the consensus / execution path still ends the process
#   with a non-zero exit (launchd / systemd restart it).
# - `overflow-checks = true`: the semantics every test runs with (debug
#   builds). An arithmetic overflow the port missed stops the node instead
#   of wrapping silently into an app-hash divergence.
[profile.release]
panic = "unwind"
overflow-checks = true

# Shipped binaries (`cargo build --profile dist`, the release workflow):
# release plus whole-program optimization. Slower to build (~2x), not for
# day-to-day work.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
