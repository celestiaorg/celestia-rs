[graph]
all-features = true

# Advisories are checked in CI (cargo-deny >= 0.18 understands CVSS 4.0).
# Every accepted advisory is listed here with its reason; see
# docs/security.md for the full triage. Re-check every entry at each triage
# (next: 2027-01-15) or when reed-solomon-erasure / ark-ff release.
[advisories]
yanked = "deny"
ignore = [
    # lru 0.7.8, only via reed-solomon-erasure 6.0.0 (latest release; block
    # propagation erasure coding). It calls only LruCache::get/put; the
    # unsound pop() path is never reached.
    { id = "RUSTSEC-2026-0253", reason = "lru 0.7 via reed-solomon-erasure: pop() unused" },
    # Unmaintained, no safe upgrade: instant via parking_lot 0.11 (pulled by
    # reed-solomon-erasure), paste (proc-macro, build time only) via
    # ark-ff (x/zkism) and tendermint-proto.
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; via reed-solomon-erasure, no upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc macro via ark-ff / tendermint-proto" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates depend on each other by path without a version
# requirement, which resolves to `*`. Allow wildcards for those path
# dependencies while still denying wildcard requirements on registry crates.
allow-wildcard-paths = true
deny = []
