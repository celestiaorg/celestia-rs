[graph]
all-features = true

# Advisories are checked in CI (cargo-deny >= 0.18 understands CVSS 4.0).
# Every accepted advisory is listed here with its reason; see
# docs/security.md for the full triage. Re-check every entry at each triage
# (next: 2027-01-15) or when ark-ff releases.
[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", allow = ["pbjson-types@=0.7.0"], expiry = "2026-12-17", reason = "chrono is unmaintained; pbjson-types uses it for protobuf timestamps (upstream #162)" },
    # Unmaintained, no safe upgrade: paste (proc-macro, build time only) via
    # ark-ff (x/zkism) and tendermint-proto.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc macro via ark-ff / tendermint-proto" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates depend on each other by path without a version
# requirement, which resolves to `*`. Allow wildcards for those path
# dependencies while still denying wildcard requirements on registry crates.
allow-wildcard-paths = true
deny = []

# Every crate comes from crates.io, from this repository (`vendor/`,
# workspace paths), or from one of the two git repositories below, pinned
# by commit (`rev`): the optional DA bridge features use both, and the
# fibre-server crate always uses lumina's `rsema1d`. A dependency from
# another registry or git URL fails the check instead of entering the
# lockfile unnoticed.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/celestiaorg/lumina",
    "https://github.com/shiguredo/tobi-quic",
]
