[package]
name = "consensus"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Port of celestia-core v0.42.3 consensus/: round state machine, vote sets, timeouts, WAL and crash recovery."
publish = false

[lints]
workspace = true

[dependencies]
ctypes = { path = "../../tier-1-protocol-types/ctypes" }
hex = "0.4"
mempool = { path = "../mempool" }
nodestore = { path = "../nodestore" }
p2p = { path = "../p2p" }
privval = { path = "../privval" }
propagation = { path = "../propagation" }
prost = "0.13"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
crypto = { path = "../../tier-0-primitives/crypto" }
hash = { path = "../../tier-0-primitives/hash" }
kvdb = { path = "../../tier-2-state-and-store/kvdb" }
pbjson-types = "0.7"
tempfile = "3"
