[package]
name = "privval"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Celestia validator signing through a local file or a CometBFT remote signer."
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23"
crypto = { path = "../../tier-0-primitives/crypto" }
ctypes = { path = "../../tier-1-protocol-types/ctypes" }
getrandom = "0.2"
gojson = { path = "../../tier-0-primitives/gojson" }
hex = "0.4"
p2p = { path = "../p2p" }
pbjson-types = "0.7"
prost = "0.13"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# Safe fsync for directory handles (std uses F_FULLFSYNC on Apple).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
hash = { path = "../../tier-0-primitives/hash" }
