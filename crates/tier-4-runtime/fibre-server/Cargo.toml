[package]
name = "fibre-server"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fibre data availability server (port of celestia-app v11 fibre.Server)."
publish = false

[lints]
workspace = true

[dependencies]
# Body type of grpc-transport's responses.
axum = { version = "=0.7.9", default-features = false }
bytes = "1"
celestia-proto = { path = "../../tier-1-protocol-types/celestia-proto" }
# Go math/rand/v2 ChaCha8 (dependency-free); seeds validator row assignment.
chacha8rand = "0.1.2"
crypto = { path = "../../tier-0-primitives/crypto" }
# catch_unwind around gRPC handlers (Go's panic-recovery interceptor).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# OS randomness for the ephemeral TLS key and certificate serial.
getrandom = "0.3"
gostr = { path = "../../tier-0-primitives/gostr" }
# Go-compatible gRPC size-limit statuses.
grpc-transport = { path = "../grpc-transport" }
hash = { path = "../../tier-0-primitives/hash" }
hex = "0.4"
http = "1"
# HTTP/2 serving with per-connection stream caps, keepalive and graceful
# GOAWAY (Go's grpc.Server options).
hyper = { version = "1", features = ["http2", "server"] }
# Reads the gRPC length prefix of an upload before tonic buffers it.
http-body = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
pbjson-types = "0.7"
prost = "0.13"
# Shard metadata store: pure Rust, ACID, ordered (same pin as kvdb).
redb = "=2.6.4"
# rsema1d primitives (RLC extension, coefficient derivation, row RLCs) from
# the lumina revision the node's Fibre client already pins.
rsema1d = { version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33" }
rustix = { version = "1", features = ["fs"] }
# TLS 1.3 only, with the tlsid certificate (Go's credentials.NewTLS).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Bech32 consensus addresses in health messages (already a dependency of
# x-fibre).
sdk = { path = "../../tier-3-app-modules/sdk" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "=0.12.3", default-features = false }
tracing = "0.1"
x-fibre = { path = "../../tier-3-app-modules/x/fibre" }
x509-parser = "0.18"
# Wipes the in-process consensus key of Ed25519RawBytesSigner on drop.
zeroize = "1"

[dev-dependencies]
# HTTP/2 client that holds upload streams open (tests/memory.rs).
hyper = { version = "1", features = ["client", "http2"] }
async-trait = "0.1"
# lumina's Rust Fibre client (the revision the node pins) against the server.
celestia-fibre = { version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33" }
ed25519-dalek = "3"
k256 = { version = "0.14", features = ["ecdsa"] }
lumina-types = { package = "celestia-types", version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33", default-features = false }
# TLS 1.2 client in tests: the server must refuse it even when another crate
# of the node enables rustls' tls12 feature.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "prost"] }
tower = { version = "0.5", features = ["util"] }
zstd = "0.14"
