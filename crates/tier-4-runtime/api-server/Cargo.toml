[package]
name = "api-server"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "gRPC query server and REST (grpc-gateway) API over the celestia-rs app, Go celestia-appd compatible."
publish = false

[lints]
workspace = true

[dependencies]
gostr = { path = "../../tier-0-primitives/gostr" }
app = { path = "../app" }
axum = { version = "=0.7.9", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
celestia-proto = { path = "../../tier-1-protocol-types/celestia-proto" }
grpc-query = { path = "../grpc-query" }
math = { path = "../../tier-0-primitives/math" }
sdk = { path = "../../tier-3-app-modules/sdk" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tonic = { version = "=0.12.3", default-features = false }
tracing = "0.1"

[dev-dependencies]
prost = "0.13"
tonic = { version = "=0.12.3", default-features = false, features = ["transport"] }
