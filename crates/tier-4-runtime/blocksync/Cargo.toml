[package]
name = "blocksync"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Exact port of celestia-core v0.42.3 `blocksync/`: the block pool (requesters, peer timeouts and bans) and the block sync reactor (channel 0x40)."
