[package]
name = "p2p"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-core v0.42 compatible P2P stack: SecretConnection, MConnection, NodeInfo handshake, Switch, PEX."
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
celestia-core-proto = { path = "../../tier-1-protocol-types/celestia-core-proto" }
chacha20poly1305 = "0.10"
crypto = { path = "../../tier-0-primitives/crypto" }
hex = "0.4"
hkdf = "0.12"
merlin = "3"
prost = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
tracing = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
