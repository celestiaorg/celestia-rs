[package]
name = "app"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-app v10 state machine: store wiring, module ordering and the ABCI++ lifecycle."
publish = false

[lints]
workspace = true

[features]
default = ["rocksdb"]
# RocksDB state backend (the default, ADR 0002). Without it the node builds
# with no C/C++ toolchain and stores state in redb.
rocksdb = ["multistore/rocksdb"]

[dependencies]
abci-server = { path = "../abci-server" }
encoding = { path = "../../tier-0-primitives/encoding" }
grpc-query = { path = "../grpc-query" }
ics23-proofs = { path = "../../tier-2-state-and-store/ics23-proofs" }
kvstore = { path = "../../tier-2-state-and-store/kvstore" }
multistore = { path = "../../tier-2-state-and-store/multistore" }
snapshots = { path = "../../tier-2-state-and-store/snapshots" }
celestia-proto = { path = "../../tier-1-protocol-types/celestia-proto" }
pbjson-types = "0.7"
base64 = "0.22"
prost-types = "0.13"
math = { path = "../../tier-0-primitives/math" }
prost = "0.13"
square = { path = "../../tier-1-protocol-types/square" }
hash = { path = "../../tier-0-primitives/hash" }
hex = "0.4"
merkle = { path = "../../tier-0-primitives/merkle" }
shares = { path = "../../tier-1-protocol-types/shares" }
sdk = { path = "../../tier-3-app-modules/sdk" }
txdecode = { path = "../../tier-3-app-modules/txdecode" }
serde_json = "1"
tracing = "0.1"
x-ante = { path = "../../tier-3-app-modules/x/ante" }
x-auth = { path = "../../tier-3-app-modules/x/auth" }
x-bank = { path = "../../tier-3-app-modules/x/bank" }
x-blob = { path = "../../tier-3-app-modules/x/blob" }
