[package]
name = "abci-server"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-core ABCI++ socket server, wire codec, and request recorder."
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
hex = "0.4"
celestia-core-proto = { path = "../../tier-1-protocol-types/celestia-core-proto" }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "fs", "process", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
