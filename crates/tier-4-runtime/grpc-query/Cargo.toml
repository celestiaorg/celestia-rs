[package]
name = "grpc-query"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-app v10 gRPC query services (GRPCQueryRouter handlers) with Go-exact pagination and errors."
