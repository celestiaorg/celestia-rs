[package]
name = "grpc-transport"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared Go-compatible gRPC framing and message-size limits."
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "=0.7.9", default-features = false }
bytes = "1"
http-body-util = "0.1"
tonic = { version = "=0.12.3", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "=0.7.9", default-features = false, features = ["http2", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport"] }
