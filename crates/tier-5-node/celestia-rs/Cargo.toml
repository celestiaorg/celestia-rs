[package]
name = "celestia-rs"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-rs node binary."
publish = false

[lints]
workspace = true

[features]
default = ["rocksdb", "jemalloc"]
# Experimental in-process DA bridge. Runtime opt-in via --bridge-rpc-listen.
da-fibre = ["da-light", "dep:celestia-fibre", "dep:celestia-grpc", "dep:fibre-types", "dep:k256", "dep:fibre-prost"]
da-webrtc = ["bridge-p2p", "dep:libp2p-webrtc", "dep:webrtc-rand"]
da-light = ["bridge-p2p", "dep:tonic", "dep:rustls"]
bridge = ["axum/ws", "app/bridge", "dep:hmac", "dep:sha2", "dep:tempfile"]
bridge-p2p = ["bridge", "dep:rustls-pki-types", "dep:libp2p", "dep:libp2p-autonat", "dep:libp2p-stream", "dep:multistream-select", "dep:futures"]
# RocksDB state backend (default); `--no-default-features` builds redb only.
rocksdb = ["app/rocksdb", "api-server/rocksdb"]
# jemalloc as the global allocator (default; unprefixed on Linux, so
# RocksDB's C++ allocations use it too). On glibc malloc the node's RSS
# was 4-5x its live heap (docs/benchmarks/memory.md).
jemalloc = ["dep:tikv-jemallocator"]
# Memory diagnostics (docs/benchmarks/memory.md): jemalloc statistics on
# the Prometheus endpoint (`memstats_heap_*`) and jemalloc's heap profiler
# (`MALLOC_CONF=prof:true,...`). Not part of the default build.
memstats = ["jemalloc", "dep:tikv-jemalloc-ctl", "tikv-jemallocator/profiling", "tikv-jemallocator/stats"]

[dependencies]
# Pin the upstream k256 0.14 migration until its first crates.io release (Lumina #1153).
fibre-types = { package = "celestia-types", version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33", default-features = false, optional = true }
fibre-prost = { package = "prost", version = "0.14", optional = true }
k256 = { version = "0.14", features = ["ecdsa"], optional = true }
celestia-grpc = { version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33", default-features = false, features = ["tls-native-roots", "tls-ring"], optional = true }
celestia-fibre = { version = "=1.3.0", git = "https://github.com/celestiaorg/lumina", rev = "ccdbed9dbcd23fe31c7fb4b7001648a45262bc33", optional = true }
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "prost", "tls-native-roots"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
multistream-select = { version = "0.14", optional = true }
futures = { version = "0.3", optional = true }
libp2p-autonat = { version = "=0.16.0", default-features = false, features = ["v1"], optional = true }
libp2p-webrtc = { version = "=0.10.0-alpha", default-features = false, features = ["tokio", "pem"], optional = true }
webrtc-rand = { package = "rand", version = "0.10", optional = true }
libp2p-stream = { version = "=0.5.0-alpha", optional = true }
libp2p = { version = "=0.57.0", default-features = false, features = ["ed25519", "tokio", "tcp", "quic", "websocket", "tls", "noise", "yamux", "dns", "identify", "kad", "gossipsub", "macros"], optional = true }
abci-server = { path = "../../tier-4-runtime/abci-server" }
anyhow.workspace = true
axum = { version = "=0.7.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.23"
api-server = { path = "../../tier-4-runtime/api-server", default-features = false }
app = { path = "../../tier-4-runtime/app", default-features = false }
blocksync = { path = "../../tier-4-runtime/blocksync" }
celestia-proto = { path = "../../tier-1-protocol-types/celestia-proto" }
consensus = { path = "../../tier-4-runtime/consensus" }
crypto = { path = "../../tier-0-primitives/crypto" }
ctypes = { path = "../../tier-1-protocol-types/ctypes" }
encoding = { path = "../../tier-0-primitives/encoding" }
evidence = { path = "../../tier-4-runtime/evidence" }
hash = { path = "../../tier-0-primitives/hash" }
hex = "0.4"
ics23 = "0.12"
keyring = { path = "../keyring" }
kvdb = { path = "../../tier-2-state-and-store/kvdb" }
light = { path = "../../tier-4-runtime/light" }
merkle = { path = "../../tier-0-primitives/merkle" }
mempool = { path = "../../tier-4-runtime/mempool" }
nodestore = { path = "../../tier-4-runtime/nodestore" }
p2p = { path = "../../tier-4-runtime/p2p" }
privval = { path = "../../tier-4-runtime/privval" }
propagation = { path = "../../tier-4-runtime/propagation" }
prost = "0.13"
rand = "0.8"
serde = "1"
shares = { path = "../../tier-1-protocol-types/shares" }
square = { path = "../../tier-1-protocol-types/square" }
rpc = { path = "../../tier-4-runtime/rpc" }
sdk = { path = "../../tier-3-app-modules/sdk" }
serde_json = "1"
multistore = { path = "../../tier-2-state-and-store/multistore" }
snapshots = { path = "../../tier-2-state-and-store/snapshots" }
statesync = { path = "../../tier-4-runtime/statesync" }
toml = "1.1"
toml_edit = "0.25"
txdecode = { path = "../../tier-3-app-modules/txdecode" }
x-blob = { path = "../../tier-3-app-modules/x/blob" }
x-consensus = { path = "../../tier-3-app-modules/x/consensus" }
tracing = "0.1"
clap = { workspace = true, features = ["env"] }
math = { path = "../../tier-0-primitives/math" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tikv-jemallocator = { version = "0.7", optional = true, features = ["unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["stats"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios"] }

[dev-dependencies]
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
tonic = { version = "=0.12.3", default-features = false, features = ["transport"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["termios", "pty"] }
