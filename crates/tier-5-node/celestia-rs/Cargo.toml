[package]
name = "celestia-rs"
version = "0.1.0-rc.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia-rs node binary."
publish = false

[lints]
workspace = true

[features]
default = ["rocksdb", "jemalloc"]
# RocksDB state backend (default); `--no-default-features` builds redb only.
rocksdb = ["app/rocksdb"]
# jemalloc as the global allocator (default; unprefixed on Linux, so
# RocksDB's C++ allocations use it too). On glibc malloc the node's RSS
# was 4-5x its live heap (docs/benchmarks/memory.md).
jemalloc = ["dep:tikv-jemallocator"]
# Memory diagnostics (docs/benchmarks/memory.md): jemalloc statistics on
# the Prometheus endpoint (`memstats_heap_*`) and jemalloc's heap profiler
# (`MALLOC_CONF=prof:true,...`). Not part of the default build.
memstats = ["jemalloc", "dep:tikv-jemalloc-ctl", "tikv-jemallocator/profiling", "tikv-jemallocator/stats"]

[dependencies]
abci-server = { path = "../../tier-4-runtime/abci-server" }
anyhow.workspace = true
axum = { version = "=0.7.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.23"
api-server = { path = "../../tier-4-runtime/api-server" }
app = { path = "../../tier-4-runtime/app", default-features = false }
blocksync = { path = "../../tier-4-runtime/blocksync" }
celestia-proto = { path = "../../tier-1-protocol-types/celestia-proto" }
consensus = { path = "../../tier-4-runtime/consensus" }
crypto = { path = "../../tier-0-primitives/crypto" }
ctypes = { path = "../../tier-1-protocol-types/ctypes" }
encoding = { path = "../../tier-0-primitives/encoding" }
evidence = { path = "../../tier-4-runtime/evidence" }
hash = { path = "../../tier-0-primitives/hash" }
hex = "0.4"
ics23 = "0.12"
keyring = { path = "../keyring" }
kvdb = { path = "../../tier-2-state-and-store/kvdb" }
light = { path = "../../tier-4-runtime/light" }
merkle = { path = "../../tier-0-primitives/merkle" }
mempool = { path = "../../tier-4-runtime/mempool" }
nodestore = { path = "../../tier-4-runtime/nodestore" }
p2p = { path = "../../tier-4-runtime/p2p" }
privval = { path = "../../tier-4-runtime/privval" }
propagation = { path = "../../tier-4-runtime/propagation" }
prost = "0.13"
rand = "0.8"
serde = "1"
shares = { path = "../../tier-1-protocol-types/shares" }
square = { path = "../../tier-1-protocol-types/square" }
rpc = { path = "../../tier-4-runtime/rpc" }
sdk = { path = "../../tier-3-app-modules/sdk" }
serde_json = "1"
multistore = { path = "../../tier-2-state-and-store/multistore" }
snapshots = { path = "../../tier-2-state-and-store/snapshots" }
statesync = { path = "../../tier-4-runtime/statesync" }
toml = "1.1"
toml_edit = "0.25"
txdecode = { path = "../../tier-3-app-modules/txdecode" }
x-blob = { path = "../../tier-3-app-modules/x/blob" }
tracing = "0.1"
clap = { workspace = true, features = ["env"] }
math = { path = "../../tier-0-primitives/math" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tikv-jemallocator = { version = "0.7", optional = true, features = ["unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["stats"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["termios", "pty"] }
