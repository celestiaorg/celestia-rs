[package]
name = "node-census"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Crawls a Celestia consensus P2P network and counts celestia-rs and Go (celestia-core) nodes."
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
celestia-core-proto = { path = "../../tier-1-protocol-types/celestia-core-proto" }
clap.workspace = true
p2p = { path = "../../tier-4-runtime/p2p" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
