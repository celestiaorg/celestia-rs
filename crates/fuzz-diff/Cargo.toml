[package]
name = "fuzz-diff"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Differential fuzzing of consensus-critical decoding against the pinned Go implementations (conformance/fuzzoracle)."
publish = false

[lints]
workspace = true

[dependencies]
abci-server = { path = "../tier-4-runtime/abci-server" }
api-server = { path = "../tier-4-runtime/api-server" }
anyhow.workspace = true
app = { path = "../tier-4-runtime/app" }
crypto = { path = "../tier-0-primitives/crypto" }
ctypes = { path = "../tier-1-protocol-types/ctypes" }
evidence = { path = "../tier-4-runtime/evidence" }
nodestore = { path = "../tier-4-runtime/nodestore" }
zstd = "0.14"
hash = { path = "../tier-0-primitives/hash" }
propagation = { path = "../tier-4-runtime/propagation" }
merkle = { path = "../tier-0-primitives/merkle" }
shares = { path = "../tier-1-protocol-types/shares" }
square = { path = "../tier-1-protocol-types/square" }
pbjson-types = "0.7"
celestia-proto = { path = "../tier-1-protocol-types/celestia-proto" }
devnet-conformance = { path = "../devnet-conformance" }
encoding = { path = "../tier-0-primitives/encoding" }
gostr = { path = "../tier-0-primitives/gostr" }
gojson = { path = "../tier-0-primitives/gojson" }
hex = "0.4"
http = "1"
keyring = { path = "../tier-5-node/keyring" }
k256 = { version = "0.13", features = ["ecdsa"] }
ics23 = "0.12"
multistore = { path = "../tier-2-state-and-store/multistore" }
prost = "0.13"
prost-reflect = "0.14"
legacy-amino = { path = "../tier-1-protocol-types/legacy-amino" }
sdk = { path = "../tier-3-app-modules/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport"] }
txdecode = { path = "../tier-3-app-modules/txdecode" }
x-ante = { path = "../tier-3-app-modules/x/ante" }
p256 = { version = "0.13", features = ["ecdsa"] }
x-gov = { path = "../tier-3-app-modules/x/gov" }
x-hyperlane = { path = "../tier-3-app-modules/x/hyperlane" }
x-ibc = { path = "../tier-3-app-modules/x/ibc" }
x-icahost = { path = "../tier-3-app-modules/x/icahost" }
x-packetforward = { path = "../tier-3-app-modules/x/packetforward" }
x-transfer = { path = "../tier-3-app-modules/x/transfer" }
