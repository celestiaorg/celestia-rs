[package]
name = "crypto"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Public-key cryptography primitives for celestia-rs."
publish = false

[lints]
workspace = true

[dependencies]
blst = "=0.3.14"
curve25519-dalek-ng = "4.1"
ed25519-consensus = { version = "2.1", default-features = false }
hash = { path = "../hash" }
# Shared worker pool for parallel signature checks (`parallel`).
rayon = "1.12"
# libsecp256k1 (C, vendored): ~2.5x k256's verification speed (CheckTx).
secp256k1 = "0.31"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
# Differential reference for the libsecp256k1 verifier (tests/secp256k1_go.rs).
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
