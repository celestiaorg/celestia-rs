[package]
name = "hash"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cryptographic hash primitives for celestia-rs (sha256, sha512, ripemd160, tmhash)."
publish = false

[lints]
workspace = true

[dependencies]
digest = "0.10"
# `asm` selects the ARMv8 SHA-2 instructions on aarch64; without it sha2
# 0.10 hashes in software there. x86-64 detects SHA-NI either way.
sha2 = { version = "0.10", features = ["asm"] }
ripemd = "0.1"

[dev-dependencies]
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
