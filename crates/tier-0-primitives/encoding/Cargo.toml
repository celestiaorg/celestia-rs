[package]
name = "encoding"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Byte encoding primitives for celestia-rs (prost, varint, hex, base64, bech32)."
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bech32 = "0.9"
bytes = "1"
hex = "0.4"
prost = "0.13"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
