[package]
name = "celestia-core-proto"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Prost bindings for celestia-core v0.42 protobufs (ABCI++, consensus, p2p, types)."
publish = false

[dependencies]
prost = { package = "prost-gostr", path = "../../tier-0-primitives/prost-gostr" }
gostr = { path = "../../tier-0-primitives/gostr" }
pbjson = "0.7"
pbjson-types = "0.7"
serde = "1"
serde_json = "1"

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false
