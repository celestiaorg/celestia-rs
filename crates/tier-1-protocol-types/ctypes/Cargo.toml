[package]
name = "ctypes"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Exact port of celestia-core v0.42.3 `types/`: blocks, headers, part sets, votes, commits, validator sets, evidence, consensus params."
publish = false

[lints]
workspace = true

[dependencies]
celestia-core-proto = { path = "../celestia-core-proto" }
crypto = { path = "../../tier-0-primitives/crypto" }
hash = { path = "../../tier-0-primitives/hash" }
merkle = { path = "../../tier-0-primitives/merkle" }
pbjson-types = "0.7"
prost = "0.13"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
