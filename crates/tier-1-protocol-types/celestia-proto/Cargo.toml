[package]
name = "celestia-proto"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Prost bindings for celestia-app v10 state-machine protobufs (cosmos-sdk, ibc-go and hyperlane forks, celestia modules)."
publish = false

[dependencies]
celestia-core-proto = { path = "../celestia-core-proto" }
ics23 = { version = "0.12", default-features = false, features = ["std"] }
prost = { package = "prost-gostr", path = "../../tier-0-primitives/prost-gostr" }
gostr = { path = "../../tier-0-primitives/gostr" }
pbjson = "0.7"
pbjson-types = "0.7"
serde = "1"
serde_json = "1"

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false
