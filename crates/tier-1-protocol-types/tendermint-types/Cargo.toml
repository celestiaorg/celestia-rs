[package]
name = "tendermint-types"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CometBFT protocol types for celestia-rs."
publish = false

[lints]
workspace = true

[dependencies]
crypto = { path = "../../tier-0-primitives/crypto" }
encoding = { path = "../../tier-0-primitives/encoding" }
hash = { path = "../../tier-0-primitives/hash" }
merkle = { path = "../../tier-0-primitives/merkle" }
prost = "0.13"
tendermint-proto = { version = "=0.40.4", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
