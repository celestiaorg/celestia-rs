[package]
name = "devnet-conformance"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Loaders and differential tests for the Go devnet oracle fixtures."
publish = false

[lints]
workspace = true

[dependencies]
abci-server = { path = "../tier-4-runtime/abci-server" }
app = { path = "../tier-4-runtime/app" }
grpc-query = { path = "../tier-4-runtime/grpc-query" }
api-server = { path = "../tier-4-runtime/api-server" }
anyhow.workspace = true
hex = "0.4"
base64 = "0.23"
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
celestia-proto = { path = "../tier-1-protocol-types/celestia-proto" }
prost = "0.13"
encoding = { path = "../tier-0-primitives/encoding" }
hash = { path = "../tier-0-primitives/hash" }
gostr = { path = "../tier-0-primitives/gostr" }

[dev-dependencies]
ctypes = { path = "../tier-1-protocol-types/ctypes" }
nodestore = { path = "../tier-4-runtime/nodestore" }
snapshots = { path = "../tier-2-state-and-store/snapshots" }
tempfile = "3"
pbjson-types = "0.7"
iavl = { path = "../tier-2-state-and-store/iavl" }
multistore = { path = "../tier-2-state-and-store/multistore" }
sdk = { path = "../tier-3-app-modules/sdk" }
txdecode = { path = "../tier-3-app-modules/txdecode" }
x-staking = { path = "../tier-3-app-modules/x/staking" }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport"] }
