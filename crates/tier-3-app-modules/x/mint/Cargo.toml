[package]
name = "x-mint"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia x/mint: time-based inflation schedule and block provisions."
publish = false

[lints]
workspace = true

[dependencies]
celestia-proto = { path = "../../../tier-1-protocol-types/celestia-proto" }
math = { path = "../../../tier-0-primitives/math" }
pbjson-types = "0.7"
prost = "0.13"
sdk = { path = "../../sdk" }
serde_json = "1"
x-auth = { path = "../auth" }
x-bank = { path = "../bank" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
