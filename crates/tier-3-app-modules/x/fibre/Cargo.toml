[package]
name = "x-fibre"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "celestia x/fibre: escrow accounts, withdrawals, pay-for-fibre settlement; genesis, BeginBlocker and Msg server."
publish = false

[lints]
workspace = true

[dependencies]
gostr = { path = "../../../tier-0-primitives/gostr" }
curve25519-dalek-ng = "4.1"
hash = { path = "../../../tier-0-primitives/hash" }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde = "1"
shares = { path = "../../../tier-1-protocol-types/shares" }
x-staking = { path = "../staking" }
celestia-proto = { path = "../../../tier-1-protocol-types/celestia-proto" }
pbjson-types = "0.7"
prost = "0.13"
sdk = { path = "../../sdk" }
serde_json = "1"
x-bank = { path = "../bank" }

[dev-dependencies]
base64 = "0.22"
crypto = { path = "../../../tier-0-primitives/crypto" }
x-auth = { path = "../auth" }
