[package]
name = "iavl"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cosmos IAVL+ state tree primitives for celestia-rs."
publish = false

[lints]
workspace = true

[dependencies]
hash = { path = "../../tier-0-primitives/hash" }
kvdb = { path = "../kvdb" }
lru = { version = "0.19", default-features = false }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
