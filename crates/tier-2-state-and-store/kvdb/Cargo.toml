[package]
name = "kvdb"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ordered key/value backends (in-memory, RocksDB and redb) for celestia-rs state storage."
publish = false

[lints]
workspace = true

[dependencies]
redb = "=2.6.4"
rocksdb = { version = "=0.24.0", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"], optional = true }

[features]
# RocksDB backend (C++ build: needs clang/libclang).
rocksdb = ["dep:rocksdb"]

[dev-dependencies]
tempfile = "3"
