[package]
name = "multistore"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cosmos SDK commit multi-store primitives for celestia-rs."
publish = false

[lints]
workspace = true

[dependencies]
encoding = { path = "../../tier-0-primitives/encoding" }
hash = { path = "../../tier-0-primitives/hash" }
ics23 = "0.12"
ics23-proofs = { path = "../ics23-proofs" }
iavl = { path = "../iavl" }
kvdb = { path = "../kvdb" }
kvstore = { path = "../kvstore" }
merkle = { path = "../../tier-0-primitives/merkle" }
prost = "0.13"
prost-types = "0.13"

[features]
# Build the RocksDB backend (benchmarks: `--features rocksdb`).
rocksdb = ["kvdb/rocksdb"]

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
