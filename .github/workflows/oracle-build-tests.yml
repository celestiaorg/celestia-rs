name: oracle-build-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR. Pushes to branches get a unique group
# (run_id), so post-merge runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s conformance/devnet -p 'test_build_bins.py' -v
      - run: bash -n conformance/devnet/build-bins.sh
