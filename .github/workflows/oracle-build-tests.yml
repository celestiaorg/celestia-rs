name: oracle-build-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s conformance/devnet -p 'test_build_bins.py' -v
      - run: bash -n conformance/devnet/build-bins.sh
