name: determinism

# Determinism of the signing binary (MILESTONES.md C1.3 / F1.9): on
# x86_64 Linux and aarch64 macOS (macos-15, the Mac Mini's target), with
# the `release` and `dist` profiles, `deliver` runs clean against Go and its
# DELIVER_TRACE (a digest of every Rust ABCI response, per height) is
# byte-identical under one square thread, the signature cache off, across
# profiles and across targets. `pp` runs clean with `dist` on both.

on:
  schedule:
    - cron: "41 2 * * *"  # 02:41 UTC daily
  workflow_dispatch:
    inputs:
      blocks:
        description: "Generated blocks per deliver run"
        default: "120"
      candidate_ref:
        description: "Candidate commit/ref to check (default: workflow commit)"
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct

jobs:
  traces:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/fuzzoracle/v10/go.mod
          cache-dependency-path: conformance/fuzzoracle/v10/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism
      - name: Reserve the diff scripts' ports (Linux)
        if: runner.os == 'Linux'
        # Keep outbound connections from taking the fixed ABCI and gRPC
        # ports before deliver / pp bind them (as in fuzz-exec.yml).
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=37658,37758,37858,39590,39690
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/devnet-bin
          key: determinism-bin-${{ runner.os }}-${{ runner.arch }}-app-v10.6.0-v9.0.8-${{ hashFiles('conformance/devnet/build-bins.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build celestia-appd v10.6.0 and v9.0.8
        run: |
          # Explicit pins also support candidates whose builder still selects
          # the historical toolchain for v10.6.0. Keep their source untouched.
          GOTOOLCHAIN=go1.26.10 APP_VERSION=v10.6.0 CORE_VERSION=v0.42.8 APPD_ONLY=1 conformance/devnet/build-bins.sh
          GOTOOLCHAIN=go1.26.9 APP_VERSION=v9.0.8 APPD_ONLY=1 DEVNET_BIN=target/devnet-bin/v9 conformance/devnet/build-bins.sh
      - name: Record exact Go oracle provenance
        run: |
          python3 scripts/quality/oracle_provenance.py \
            --out "$RUNNER_TEMP/oracle-provenance.json" \
            --binary v10=target/devnet-bin/celestia-appd \
            --binary v9=target/devnet-bin/v9/celestia-appd
          cat "$RUNNER_TEMP/oracle-provenance.json" >>"$GITHUB_STEP_SUMMARY"
      - name: Build fuzz-diff (release, dist)
        run: |
          cargo build --locked --release -p fuzz-diff
          cargo build --locked --profile dist -p fuzz-diff
      - name: Traces (release)
        env:
          DEVNET_BIN: ${{ github.workspace }}/target/devnet-bin
          FUZZ_DIFF: ${{ github.workspace }}/target/release/fuzz-diff
          GENERATED_BLOCKS: ${{ inputs.blocks || '120' }}
        run: |
          python3 scripts/quality/qualify.py --out "$RUNNER_TEMP/qualification/release" \
            --binary "$FUZZ_DIFF" --binary target/devnet-bin/celestia-appd \
            --binary target/devnet-bin/v9/celestia-appd -- \
            crates/fuzz-diff/determinism.sh "$RUNNER_TEMP/traces" release "$GENERATED_BLOCKS"
      - name: Traces (dist)
        if: always()
        env:
          DEVNET_BIN: ${{ github.workspace }}/target/devnet-bin
          FUZZ_DIFF: ${{ github.workspace }}/target/dist/fuzz-diff
          GENERATED_BLOCKS: ${{ inputs.blocks || '120' }}
        run: |
          python3 scripts/quality/qualify.py --out "$RUNNER_TEMP/qualification/dist" \
            --binary "$FUZZ_DIFF" --binary target/devnet-bin/celestia-appd \
            --binary target/devnet-bin/v9/celestia-appd -- \
            crates/fuzz-diff/determinism.sh "$RUNNER_TEMP/traces" dist "$GENERATED_BLOCKS"
      - name: release and dist traces identical
        run: |
          set -e
          cd "$RUNNER_TEMP/traces"
          for t in release/*.trace; do
            cmp "$t" "dist/${t#release/}"
          done
          mkdir -p "$RUNNER_TEMP/upload"
          cp release/*.trace "$RUNNER_TEMP/upload/"
      - name: ProcessProposal differential (dist)
        env:
          FUZZ_DIFF: ${{ github.workspace }}/target/dist/fuzz-diff
        run: |
          set -e
          GO_APPD=target/devnet-bin/celestia-appd crates/fuzz-diff/pp-diff.sh blob 20 1
          GO_APPD=target/devnet-bin/celestia-appd crates/fuzz-diff/pp-diff.sh ibc 20 2
          GO_APPD=target/devnet-bin/v9/celestia-appd crates/fuzz-diff/pp-diff.sh v9-blob 20 3
      - if: always()
        name: Preserve exact oracle provenance
        run: |
          mkdir -p "$RUNNER_TEMP/upload"
          test ! -f "$RUNNER_TEMP/oracle-provenance.json" || cp "$RUNNER_TEMP/oracle-provenance.json" "$RUNNER_TEMP/upload/"
          test ! -d "$RUNNER_TEMP/qualification" || cp -R "$RUNNER_TEMP/qualification" "$RUNNER_TEMP/upload/qualification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traces-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/upload
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-logs-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/traces
          retention-days: 14

  # The same traces on x86_64 Linux and aarch64 macOS.
  across-targets:
    needs: traces
    runs-on: ubuntu-latest
    steps:
      # Use the workflow revision's comparator, while qualification receipts
      # identify the separately checked-out candidate on each platform.
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: traces-*
      - run: |
          python3 scripts/quality/compare_determinism.py \
            traces-Linux-X64 traces-macOS-ARM64 --out comparison.json
          cat traces-Linux-X64/oracle-provenance.json \
            traces-macOS-ARM64/oracle-provenance.json comparison.json >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-comparison
          path: comparison.json
          retention-days: 30
