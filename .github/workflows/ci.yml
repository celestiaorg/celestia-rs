name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same PR. On main, a running push run always
# finishes (it saves the shared caches and gives release.yml a green commit),
# but a newer push replaces any run still waiting behind it, so main runs at
# most one ci behind the tip instead of one per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      go: ${{ steps.classify.outputs.go }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify the pull request
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Classify both the PR diff and the merged result. Fall back to full
          # CI if the merge ref doesn't match the event or either diff fails.
          [[ $(git rev-parse --verify HEAD^1) == "$BASE_SHA" &&
             $(git rev-parse --verify HEAD^2) == "$HEAD_SHA" ]] || exit 0
          paths="$RUNNER_TEMP/ci-changed-paths"
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" -- > "$paths" || exit 0
          [[ -s "$paths" ]] || exit 0
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- >> "$paths" || exit 0
          # The Go conformance modules and release oracles are skipped only
          # when the diff is known and touches neither conformance/ nor the
          # workflows that run them. The Go modules are self-contained under
          # conformance/, so no other change can break them.
          # grep reads the file itself: a pipe into `grep -q` can fail under
          # pipefail when grep exits at the first match.
          grep -qzE '^(conformance/|\.github/workflows/(ci|go-oracles)\.yml$)' "$paths" ||
            echo 'go=false' >> "$GITHUB_OUTPUT"
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|docs/.nojekyll|docs/MODULES.md|docs/hardware.md|docs/operator-guide.md|\
              docs/index.html|docs/index.md|docs/404.html|docs/llms.txt|docs/sitemap.xml|\
              docs/about/index.html|docs/contact/index.html|docs/privacy/index.html|\
              docs/census/index.html|docs/census/census.css|docs/census/census.js|\
              docs/site/copy.js|docs/site/square.webp|docs/site/style.css|scripts/site/test_site.py) ;;
              *) exit 0 ;;
            esac
          done < "$paths"
          echo 'docs_only=true' >> "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: [changes, rust-tests, doctests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.docs_only == 'true'
        with:
          fetch-depth: 2
      - name: Validate documentation changes
        if: needs.changes.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA" HEAD --
          if [[ -f docs/site/copy.js ]]; then
            node --check docs/site/copy.js
          fi
          python3 -m unittest discover -s scripts/site -p 'test_*.py' -v
      - name: Require both Linux test suites
        if: needs.changes.outputs.docs_only != 'true'
        env:
          RUST_TESTS: ${{ needs.rust-tests.result }}
          DOCTESTS: ${{ needs.doctests.result }}
        run: |
          printf 'Unit and integration tests: %s\nDoctests: %s\n' "$RUST_TESTS" "$DOCTESTS"
          [[ "$RUST_TESTS" == success && "$DOCTESTS" == success ]]

  rust-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fuzz evidence accounting
        run: python3 -m unittest discover -s crates/fuzz-diff/tests -p '*_test.py' -v
      - name: Quality evidence accounting
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py' -v
      - name: Operator website
        run: python3 -m unittest discover -s scripts/site -p 'test_*.py' -v
      - name: Transaction-result receipt failure paths
        run: bash packaging/test-compare-block-results.sh
      - name: Operator benchmark scripts
        run: |
          shellcheck -x scripts/bench/*.sh
          bash scripts/bench/test.sh
          bash scripts/bench/checkpoints-test.sh
          shellcheck -x -S warning scripts/vmexec/*.sh scripts/vmexec/vmexec
          bash scripts/vmexec/test.sh
      - name: Mixed devnet crash-boundary checks
        run: python3 -m unittest discover -s conformance/devnet/tests -v
      - name: gRPC limit evidence integrity
        run: python3 conformance/grpc-limits/verify.py
      - name: gRPC lifecycle evidence integrity
        run: |
          python3 -m unittest -v conformance/grpc-lifecycle/test_verify.py
          python3 conformance/grpc-lifecycle/verify.py conformance/grpc-lifecycle/v10.5.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: Linux unit and integration tests
        run: cargo nextest run --locked --workspace --all-features --profile ci
      # `--all-features` selects jemalloc; the shipped default build uses
      # mimalloc. Build that binary and check it reports mimalloc.
      - name: Default-feature binary uses mimalloc
        run: cargo nextest run --locked -p celestia-rs --test allocator --profile ci

  doctests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux doctests
        run: cargo test --locked --workspace --all-features --doc

  rpc-evidence:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The live-transaction capture used a pre-squash candidate. Its lockfile
      # must remain verifiable when a dependency update changes today's lockfile.
      - name: Fetch recorded live-transaction source
        run: git fetch --no-tags origin d2e72cbb676814746226224a27ea038fbbd8fcf2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify RPC evidence accounting
        run: python3 -m unittest discover -s conformance/mainnet-rpc/tests -v
      - name: Fresh authz and feegrant capture integrity
        run: python3 conformance/mainnet-rpc/populated-authz/verify.py
      - name: Validate scoped evidence and admitted current-release regressions
        run: >-
          python3 conformance/mainnet-rpc/coverage.py --run-current --verify-scoped
          --json ${{ runner.temp }}/rpc-coverage.json
      - name: Bounded provider baseline completion
        run: python3 conformance/mainnet-rpc/readiness.py
      - name: Persistent RPC capture controller
        run: python3 -m unittest discover -s conformance/mainnet-rpc/persistence -v
      - name: Preserve incomplete restart-campaign evidence
        run: python3 conformance/mainnet-rpc/persistence/verify_reproduction.py
      - name: Ordered restart pruning and index matrix
        run: python3 conformance/mainnet-rpc/persistence/verify_ordered.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-evidence-inventory
          path: ${{ runner.temp }}/rpc-coverage.json
          retention-days: 30

  # A small, deterministic budget protects the signer and socket boundary.
  # The complete per-crate report runs nightly, without a second PR workspace build.
  coverage-critical:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-critical
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure critical boundary coverage
        run: |
          mkdir -p ${{ runner.temp }}/quality
          rustc -Vv > ${{ runner.temp }}/quality/toolchain.txt
          cargo llvm-cov --locked -p abci-server -p privval --json --output-path ${{ runner.temp }}/quality/llvm.json
      - name: Check coverage budgets
        run: >-
          python3 scripts/quality/coverage.py ${{ runner.temp }}/quality/llvm.json
          --policy scripts/quality/coverage-budgets.json --out ${{ runner.temp }}/quality
          --suite 'cargo llvm-cov --locked -p abci-server -p privval'
      - if: always()
        run: test ! -f ${{ runner.temp }}/quality/coverage.md || cat ${{ runner.temp }}/quality/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage
          path: ${{ runner.temp }}/quality
          retention-days: 30

  # The reference validator is a Mac Mini M4 (aarch64-apple-darwin): build
  # the node in release mode on Apple silicon and run a fast smoke subset
  # (unit tests of the core crates, one devnet-conformance replay, the CLI
  # on a fresh home). The full suite runs on Linux above.
  # This is the slowest job (about 27 minutes), and a platform-only break is
  # rare, so it runs on pushes to main, not on pull requests.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build celestia-rs (release)
        run: cargo build --release --locked -p celestia-rs
      - name: CLI smoke (init, keys, comet, open-files check)
        run: |
          set -eux
          B=target/release/celestia-rs
          H=$(mktemp -d)/node
          $B version --long
          $B version --long | grep -qx 'allocator: mimalloc'
          $B init smoke --chain-id smoke-1 --home "$H"
          test -s "$H/config/priv_validator_key.json"
          test -s "$H/data/priv_validator_state.json"
          $B keys add operator --keyring-backend test --home "$H" --no-backup
          $B keys show operator -a --keyring-backend test --home "$H"
          $B comet show-validator --home "$H"
          $B start --network local --home "$(dirname "$H")/local" --stop-at-height 3
      - name: Unit tests (core crates, release)
        run: >-
          cargo test --release --locked
          -p hash -p merkle -p nmt -p shares -p square
          -p kvdb -p iavl -p multistore -p privval -p keyring
          -p celestia-rs --lib
      - name: Devnet-conformance replay (staking, release)
        run: cargo test --release --locked -p devnet-conformance --test replay_scenarios -- --exact staking_parity

  deny:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # cargo-deny >= 0.18 parses CVSS 4.0 advisories; accepted advisories
      # are listed with reasons in deny.toml and docs/security.md.
      # Pinned by commit: each action release bundles one cargo-deny
      # version (v2.1.5: cargo-deny 0.22.1), so a new release reaches this
      # job only through a Dependabot pull request, not through the moving
      # v2 tag. Keep nightly.yml on the same pin.
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
          arguments: --all-features

  # Every Go conformance module (fixture generators, oracles, recorders)
  # must keep building. Module downloads are retried: proxy.golang.org
  # has transient failures, and the module cache is restored between runs.
  # Pull requests that touch neither conformance/ nor this workflow skip it.
  go-modules:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - antereplay
          - antevectors
          - consensusvectors
          - ctypesvectors
          - devnet-oracle
          - evidencevectors
          - fibre-client
          - fibre-interop
          - fibre-server
          - fixturegen
          - fuzzoracle/v9
          - fuzzoracle/v10
          - grpc-limits/recorder
          - grpc-lifecycle/recorder
          - grpc-reflection
          - lightvectors
          - mathvectors
          - mintvectors
          - p2pvectors
          - pfm-fork
          - provider-client
          - rpc-relay
          - rpccorpus/recorder
          - mainnet-rpc/module-closure/proofcheck
          - txdecode
          - strict-txdecode
          - v11-frozen
          - websocket-lifecycle
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/${{ matrix.module }}/go.mod
          cache: false
      # Only main saves Go caches. Pull-request caches are scoped to their
      # PR, and at about 1 GB per module they evicted main's Rust caches.
      - name: Restore Go caches
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles(format('conformance/{0}/go.mod', matrix.module), format('conformance/{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ runner.os }}-${{ matrix.module }}-
      - name: Cache Go modules and builds
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles(format('conformance/{0}/go.mod', matrix.module), format('conformance/{0}/go.sum', matrix.module)) }}
          restore-keys: go-${{ runner.os }}-${{ matrix.module }}-
      - name: Download modules (with retries)
        working-directory: conformance/${{ matrix.module }}
        run: |
          for n in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $n); retrying in $((n * 15))s"
            sleep $((n * 15))
          done
          exit 1
      - name: Build
        working-directory: conformance/${{ matrix.module }}
        # Keep binaries out of the source tree checked by the evidence tests.
        run: go build -o "$(mktemp -d)/" ./...
      - name: Test
        if: >-
          matrix.module == 'fixturegen' || matrix.module == 'antereplay' ||
          matrix.module == 'fuzzoracle/v10' || matrix.module == 'pfm-fork' ||
          matrix.module == 'websocket-lifecycle'
        working-directory: conformance/${{ matrix.module }}
        run: go test -timeout 30m ./...

  # The release oracles (one celestia-app release each) are slow to build
  # and only prove that the committed fixtures can be regenerated from Go.
  # The Rust replays of those fixtures run in `test` on every pull request.
  # So the oracles run here only when a pull request touches conformance/
  # or these workflows, and every night on main (nightly.yml).
  go-oracles:
    needs: changes
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.go != 'false' }}
    uses: ./.github/workflows/go-oracles.yml
