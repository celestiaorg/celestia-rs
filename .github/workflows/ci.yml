name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz evidence accounting
        run: python3 -m unittest discover -s crates/fuzz-diff/tests -p '*_test.py' -v
      - name: Quality evidence accounting
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py' -v
      - name: gRPC limit evidence integrity
        run: python3 conformance/grpc-limits/verify.py
      - run: cargo test --workspace --all-features

  rpc-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify RPC evidence accounting
        run: python3 -m unittest discover -s conformance/mainnet-rpc/tests -v
      - name: Validate scoped evidence and admitted current-release regressions
        run: >-
          python3 conformance/mainnet-rpc/coverage.py --run-current --verify-scoped
          --json ${{ runner.temp }}/rpc-coverage.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-evidence-inventory
          path: ${{ runner.temp }}/rpc-coverage.json
          retention-days: 30

  # A small, deterministic budget protects the signer and socket boundary.
  # The complete per-crate report runs nightly, without a second PR workspace build.
  coverage-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-critical
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure critical boundary coverage
        run: |
          mkdir -p ${{ runner.temp }}/quality
          rustc -Vv > ${{ runner.temp }}/quality/toolchain.txt
          cargo llvm-cov --locked -p abci-server -p privval --json --output-path ${{ runner.temp }}/quality/llvm.json
      - name: Check coverage budgets
        run: >-
          python3 scripts/quality/coverage.py ${{ runner.temp }}/quality/llvm.json
          --policy scripts/quality/coverage-budgets.json --out ${{ runner.temp }}/quality
          --suite 'cargo llvm-cov --locked -p abci-server -p privval'
      - if: always()
        run: test ! -f ${{ runner.temp }}/quality/coverage.md || cat ${{ runner.temp }}/quality/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage
          path: ${{ runner.temp }}/quality
          retention-days: 30

  # The reference validator is a Mac Mini M4 (aarch64-apple-darwin): build
  # the node in release mode on Apple silicon and run a fast smoke subset
  # (unit tests of the core crates, one devnet-conformance replay, the CLI
  # on a fresh home). The full suite runs on Linux above.
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - name: Build celestia-rs (release)
        run: cargo build --release --locked -p celestia-rs
      - name: CLI smoke (init, keys, comet, open-files check)
        run: |
          set -eux
          B=target/release/celestia-rs
          H=$(mktemp -d)/node
          $B version --long
          $B init smoke --chain-id smoke-1 --home "$H"
          test -s "$H/config/priv_validator_key.json"
          test -s "$H/data/priv_validator_state.json"
          $B keys add operator --keyring-backend test --home "$H" --no-backup
          $B keys show operator -a --keyring-backend test --home "$H"
          $B comet show-validator --home "$H"
          $B start --network local --home "$(dirname "$H")/local" --stop-at-height 3
      - name: Unit tests (core crates, release)
        run: >-
          cargo test --release --locked
          -p hash -p merkle -p nmt -p shares -p square
          -p kvdb -p iavl -p multistore -p privval -p keyring
          -p celestia-rs --lib
      - name: Devnet-conformance replay (staking, release)
        run: cargo test --release --locked -p devnet-conformance --test replay_scenarios -- --exact staking_parity

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # cargo-deny >= 0.18 parses CVSS 4.0 advisories; accepted advisories
      # are listed with reasons in deny.toml and docs/security.md.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # Every Go conformance module (fixture generators, oracles, recorders)
  # must keep building. Module downloads are retried: proxy.golang.org
  # has transient failures, and the module cache is restored between runs.
  go-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - antereplay
          - antevectors
          - consensusvectors
          - ctypesvectors
          - devnet-oracle
          - evidencevectors
          - fibre-client
          - fixturegen
          - fuzzoracle/v9
          - fuzzoracle/v10
          - grpc-limits/recorder
          - lightvectors
          - mathvectors
          - mintvectors
          - p2pvectors
          - provider-client
          - rpccorpus/recorder
          - txdecode
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/${{ matrix.module }}/go.mod
          cache-dependency-path: conformance/${{ matrix.module }}/go.sum
      - name: Download modules (with retries)
        working-directory: conformance/${{ matrix.module }}
        run: |
          for n in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $n); retrying in $((n * 15))s"
            sleep $((n * 15))
          done
          exit 1
      - name: Build
        working-directory: conformance/${{ matrix.module }}
        run: go build ./...
      - name: Test
        if: matrix.module == 'fixturegen' || matrix.module == 'antereplay' || matrix.module == 'fuzzoracle/v10'
        working-directory: conformance/${{ matrix.module }}
        run: go test ./...
