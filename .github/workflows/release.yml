name: release

# Builds celestia-rs with the `dist` profile for the validator platforms and
# publishes the archives and their SHA-256 checksums as a GitHub release.
# The version is the binary crate's (crates/tier-5-node/celestia-rs), so
# `celestia-rs version` always reports the release it came from. See
# docs/releasing.md.
#
# - Push to main that changes that version (the merged release PR from
#   prepare-release.yml): tag the commit v<version>, then build and publish.
#   The tag is pushed with GITHUB_TOKEN, which starts no workflows, so the
#   build runs here rather than on the tag push.
# - Push of a v* tag by hand: build and publish it, if the tag matches the
#   crate version.
# - Daily at 14:00 UTC: an automatic release of the newest main commit
#   whose ci push run passed, if it is not released yet, as the next patch
#   version on the crate version's major.minor line: v0.1.0, v0.1.1, ...
#   (after a human v0.2.0: v0.2.1, ...). release-channels.yml then promotes
#   it network by network.
# - No release is marked "Latest" here: release-channels.yml marks the
#   mainnet channel's release Latest, so github.com/<repo>/releases/latest
#   and `install.sh` without --channel get the release mainnet runs.
# - workflow_dispatch: build the archives as workflow artifacts only.

on:
  push:
    branches: [main]
    # Not applied to tag pushes.
    paths: [crates/tier-5-node/celestia-rs/Cargo.toml]
    tags: ["v*"]
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'daily' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MANIFEST: crates/tier-5-node/celestia-rs/Cargo.toml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_version: ${{ steps.plan.outputs.release_version }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The daily release counts its commit's position on main.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          crate_version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          version=$(crate_version <"$MANIFEST")
          sha=$(git rev-parse HEAD)
          release_version=""
          tag="v$version"
          release=false
          label="$tag"
          # tag_once TAG: tag $sha unless TAG exists. Sets release=true when
          # this run made the tag or a re-run finds it on $sha.
          tag_once() {
            local tagged
            if tagged=$(git ls-remote --exit-code --tags origin "refs/tags/$1^{}" "refs/tags/$1"); then
              if printf '%s\n' "$tagged" | grep -q "^$sha"; then
                release=true # a re-run of this release (say, after a failed build)
              else
                echo "::notice::$1 already exists on another commit: nothing to release"
              fi
              return
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$1" -m "celestia-rs $1" "$sha"
            git push origin "refs/tags/$1"
            echo "::notice::tagged $sha as $1"
            release=true
          }
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            schedule/*)
              # The newest main commit whose ci push run passed.
              green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
              if [ -z "$green" ] || ! git merge-base --is-ancestor "$green" HEAD; then
                echo "::error::no main commit with a passing ci push run"
                exit 1
              fi
              git checkout -q --detach "$green"
              sha=$green
              version=$(crate_version <"$MANIFEST")
              previous=$(git show "HEAD^:$MANIFEST" 2>/dev/null | crate_version || true)
              released=$(git tag --points-at "$sha" 'v*' | head -n 1)
              if [ -n "$released" ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
                echo "::notice::${sha:0:7} is already released as $released: nothing to release"
              elif [ "$previous" != "$version" ]; then
                echo "::notice::${sha:0:7} sets the version to $version; the push trigger releases it"
              else
                # The next patch on the crate's major.minor line: one more
                # than the highest v<major>.<minor>.<patch> tag, else the
                # crate's own patch (crate 0.1.0-rc.9, no v0.1.x yet: 0.1.0).
                core=${version%%-*}
                line=${core%.*}
                # A re-run (attempt > 1) of a run that already tagged this
                # commit resumes that release instead of taking a new patch.
                retag=$(git tag --points-at "$sha" "v$line.*" | grep -E "^v${line//./\\.}\.[0-9]+\$" | head -n 1 || true)
                last=$(git tag -l "v$line.*" | sed -n "s/^v${line//./\\.}\.\([0-9][0-9]*\)\$/\1/p" | sort -n | tail -n 1)
                if [ -n "$retag" ]; then
                  release_version=${retag#v}
                elif [ -n "$last" ]; then
                  release_version="$line.$((last + 1))"
                else
                  release_version=$core
                fi
                version=$release_version
                tag="v$version"
                label="$tag"
                tag_once "$tag"
              fi
              ;;
            push/tag)
              if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::tag $GITHUB_REF_NAME, but $MANIFEST is at $version. Release with the 'prepare release' workflow (docs/releasing.md), or tag the commit that carries the version."
                exit 1
              fi
              release=true
              ;;
            push/branch)
              previous=""
              if git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
                previous=$(git show "$BEFORE:$MANIFEST" | crate_version)
              fi
              if [ "$previous" = "$version" ]; then
                echo "::notice::$MANIFEST changed, but not its version ($version): nothing to release"
              else
                tag_once "$tag"
              fi
              ;;
            *) label=$(git rev-parse --short HEAD) ;;
          esac
          {
            echo "version=$version"
            echo "release_version=$release_version"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "release=$release"
            echo "label=$label"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    # A push to main that releases nothing builds nothing.
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          # ubuntu-22.04 (glibc 2.35) so the binaries run on older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            # RocksDB's bindgen parses the C API headers for the target.
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu=--sysroot=/usr/aarch64-linux-gnu"
            # jemalloc bakes the page size in at build time: 64 KiB works
            # on 4, 16 and 64 KiB page kernels (Graviton, Ampere, RPi 5).
            echo "JEMALLOC_SYS_WITH_LG_PAGE=16"
          } >> "$GITHUB_ENV"
      - name: Build
        env:
          CELESTIA_RS_BUILD_PROFILE: dist
          # Empty except for automatic releases (see the header).
          CELESTIA_RS_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
        run: cargo build --profile dist --locked -p celestia-rs --features da-light --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          set --
          if [[ "$CROSS" == true ]]; then
            set -- qemu-aarch64 -L /usr/aarch64-linux-gnu
          fi
          bin=target/${{ matrix.target }}/dist/celestia-rs
          details=$("$@" "$bin" version --long)
          echo "$details"
          grep -Fx "commit: $SHA" <<<"$details"
          grep -Fx 'build_profile: dist' <<<"$details"
          [[ "$("$@" "$bin" --version)" == "celestia-rs $VERSION" ]]
          [[ "$("$@" "$bin" version)" == "$VERSION" ]]
          "$@" "$bin" start --help | grep -- --bridge-p2p-listen
          "$@" "$bin" da-light --help >/dev/null
      - name: Package
        shell: bash
        env:
          LABEL: ${{ needs.plan.outputs.label }}
        run: |
          set -euo pipefail
          name="celestia-rs-${LABEL}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/celestia-rs" "dist/$name/"
          cp -R LICENSE-APACHE LICENSE-MIT README.md packaging "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: celestia-rs-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cat *.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          AUTOMATIC: ${{ needs.plan.outputs.release_version != '' }}
        run: |
          set -euo pipefail
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          if [[ "$AUTOMATIC" == true ]]; then
            # A daily release has no CHANGELOG section of its own.
            printf 'Daily release of main at %s. Release channels (docs/releasing.md) decide which network runs it.\n\n' "$SHA" >notes.md
          else
            # The release's CHANGELOG section (bump-version cut it), then
            # GitHub's generated notes.
            awk -v h="## $TAG " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md >notes.md
          fi
          # Releases are immutable once published: no assets can be added
          # after. So create a draft, attach the archives, then publish. A
          # re-run finds the draft a failed run left behind and finishes it.
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md --generate-notes --latest=false $prerelease
            draft=true
          fi
          if [ "$draft" != true ]; then
            echo "::error::$TAG is already published, and a published release is immutable: release a new version instead"
            exit 1
          fi
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest=false
