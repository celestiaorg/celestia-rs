name: fuzz-exec

# Execution differentials against Go celestia-app v10.4.0 and v9.0.8
# (MILESTONES.md C1.2 / F1.1): `json_*`, `c_*` (F1.7), `exec`, `pp` and `deliver`
# (DELIVER_IBC / HL / WIRE / SWEEP / RECHECK / SIM, and DELIVER_UPGRADE on
# v9-upgrade), sharded by crates/fuzz-diff/nightly.sh, which rotates
# scenarios, modes and flags with the run number. A mismatch fails the job
# and uploads the run's output, Go log and reproduction line.
#
# `workflow_dispatch` with `campaign: true` runs C1.4's fresh campaign
# instead: every scenario at both app versions with every flag, and the
# v9 -> v10 upgrade over 12 seeds.

on:
  schedule:
    - cron: "17 1 * * *"  # 01:17 UTC daily, before nightly.yml
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (default: the run number)"
        default: ""
      blocks:
        description: "Generated blocks per deliver run"
        default: "300"
      campaign:
        description: "Run the C1.4 campaign (every scenario and flag) instead of the nightly rotation"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct

jobs:
  bins:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/fuzzoracle/v10/go.mod
          cache-dependency-path: conformance/*/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/devnet-bin
          key: fuzz-exec-bin-app-v10.4.0-v9.0.8-${{ hashFiles('conformance/devnet/build-bins.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build celestia-appd v10.4.0 and v9.0.8
        run: |
          conformance/devnet/build-bins.sh
          APP_VERSION=v9.0.8 APPD_ONLY=1 DEVNET_BIN=target/devnet-bin/v9 conformance/devnet/build-bins.sh
      - name: Build the Go oracles
        run: |
          mkdir -p target/fuzzoracle
          for v in v9 v10; do
            (cd conformance/fuzzoracle/$v && go build -o "$GITHUB_WORKSPACE/target/fuzzoracle/fuzzoracle-$v" .)
          done
      - run: cargo build --release -p fuzz-diff
      - run: |
          mkdir -p bins
          cp -r target/devnet-bin bins/devnet-bin
          cp -r target/fuzzoracle bins/fuzzoracle
          cp target/release/fuzz-diff bins/
      - uses: actions/upload-artifact@v7
        with:
          name: fuzz-exec-bins
          path: bins
          retention-days: 2

  diff:
    needs: bins
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.campaign && '["campaign-0of8","campaign-1of8","campaign-2of8","campaign-3of8","campaign-4of8","campaign-5of8","campaign-6of8","campaign-7of8"]' || '["regressions","json","consensus","exec","pp","deliver-0of6","deliver-1of6","deliver-2of6","deliver-3of6","deliver-4of6","deliver-5of6","upgrade-0of2","upgrade-1of2"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fuzz-exec-bins
          path: bins
      - name: Reserve the diff scripts' ports
        # The Go apps listen on fixed ports inside the ephemeral range
        # (32768-60999): a long-lived outgoing connection on the runner
        # that is handed one of them makes every later run of the shard
        # fail with `address already in use`.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=37658,37758,37858,39590,39690
      - name: Install binaries
        run: |
          mkdir -p target/release
          mv bins/devnet-bin target/devnet-bin
          mv bins/fuzzoracle target/fuzzoracle
          mv bins/fuzz-diff target/release/fuzz-diff
          chmod +x target/devnet-bin/* target/devnet-bin/v9/* target/fuzzoracle/* target/release/fuzz-diff
      - name: ${{ matrix.job }}
        env:
          DEVNET_BIN: ${{ github.workspace }}/target/devnet-bin
          FUZZ_ORACLE_V9: ${{ github.workspace }}/target/fuzzoracle/fuzzoracle-v9
          FUZZ_ORACLE_V10: ${{ github.workspace }}/target/fuzzoracle/fuzzoracle-v10
          BUDGET_SECS: "7200"
          BLOCKS: ${{ inputs.blocks || '300' }}
          TMPDIR: ${{ runner.temp }}
        run: |
          seed="${{ inputs.seed }}"
          seed=${seed:-${{ github.run_number }}}
          crates/fuzz-diff/nightly.sh "${{ matrix.job }}" "$seed" "${{ runner.temp }}/findings"
      - if: always()
        run: cat "${{ runner.temp }}/findings/summary.txt" >>"$GITHUB_STEP_SUMMARY" || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.job }}
          path: ${{ runner.temp }}/findings
          retention-days: 30
