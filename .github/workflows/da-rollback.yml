name: DA bridge rollback
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/da-rollback.yml'
      - 'conformance/da/test-bridge-rollback.sh'
      - 'crates/tier-5-node/celestia-rs/Cargo.toml'
      - 'crates/tier-5-node/celestia-rs/src/bridge*'
      - 'crates/tier-5-node/celestia-rs/src/bridge/**'
      - 'crates/tier-5-node/celestia-rs/src/node.rs'
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build one executable with both feature profiles
        run: |
          cargo build --locked --no-default-features -p celestia-rs
          cp target/debug/celestia-rs "$RUNNER_TEMP/consensus"
          cargo build --locked --no-default-features --features bridge-p2p -p celestia-rs
      - name: Roll back the operator binary on the same private chain
        run: conformance/da/test-bridge-rollback.sh "$RUNNER_TEMP/consensus" target/debug/celestia-rs
