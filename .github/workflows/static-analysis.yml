name: static analysis

# CodeQL takes about 19 minutes, so it runs on pushes to main (where its
# alerts land in code scanning), not on pull requests. Kani runs on pull
# requests that can change its proof: the shares crate and its dependencies.
on:
  pull_request:
    paths:
      - .github/workflows/static-analysis.yml
      - Cargo.lock
      - crates/tier-0-primitives/encoding/**
      - crates/tier-0-primitives/hash/**
      - crates/tier-1-protocol-types/shares/**
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR. On main, a running push run always
# finishes, but a newer push replaces any run still waiting behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (Rust)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Report Rust CodeQL finding count
        run: |
          jq -er '"Rust CodeQL findings: \([.runs[].results[]] | length)"' \
            "$RUNNER_TEMP/codeql-results/rust.sarif" | tee -a "$GITHUB_STEP_SUMMARY"

  kani:
    name: Kani (shares)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: cargo kani -p shares --output-format terse
