name: static analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Report Rust CodeQL finding count
        run: |
          jq -er '"Rust CodeQL findings: \([.runs[].results[]] | length)"' \
            "$RUNNER_TEMP/codeql-results/rust.sarif" | tee -a "$GITHUB_STEP_SUMMARY"

  kani:
    name: Kani (shares)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: cargo kani -p shares --output-format terse
