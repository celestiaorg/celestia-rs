name: Rust DA Fibre interoperability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conformance/da/fibre/**'
      - 'crates/tier-5-node/celestia-rs/src/bridge/fibre.rs'
      - 'crates/tier-5-node/celestia-rs/src/bridge/submit/fibre.rs'
      - 'crates/tier-5-node/celestia-rs/src/bridge/peer/light/wallet.rs'
      - '.github/workflows/da-fibre-interop.yml'

permissions:
  contents: read

jobs:
  fibre:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: Mainnet
            revision: d5dfb21a0885622828e30e8e2daf50e5d1bb72b2
          - network: Mocha-5
            revision: af9897bb471959660a4179048656694f3013b2f5
    name: Fibre provider and wallets (${{ matrix.network }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: celestiaorg/celestia-node
          ref: ${{ matrix.revision }}
          path: go-node
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-node/go.mod
          cache-dependency-path: go-node/go.sum
      - name: Build the one-binary Fibre configuration
        run: cargo build --locked -p celestia-rs --no-default-features --features da-fibre
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
      - name: Read a Go payment through the Rust light RPC
        run: conformance/da/fibre/test-go-provider.sh go-node --rust-node target/debug/celestia-rs
        env:
          DA_FIBRE_CONTROL: ${{ runner.temp }}/paid-fibre-control.json
      - uses: actions/upload-artifact@v7
        with:
          name: paid-fibre-control-${{ matrix.network }}
          path: ${{ runner.temp }}/paid-fibre-control.json
          if-no-files-found: error
      - name: Settle uploads through the Rust bridge
        run: conformance/da/fibre/test-bridge-download.sh target/debug/celestia-rs go-node
      - name: Settle uploads through a separately funded Rust light wallet
        run: conformance/da/fibre/test-bridge-download.sh target/debug/celestia-rs go-node --light
      - name: Reconstruct after a registered minority provider stops
        run: conformance/da/fibre/test-bridge-download.sh target/debug/celestia-rs go-node --provider-loss
