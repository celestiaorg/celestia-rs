name: Rust DA light interoperability
on:
  workflow_dispatch:
    inputs:
      observer_seconds:
        description: Duration of concurrent Go and Rust observer reads in seconds (at least 10)
        required: false
        type: string
  pull_request:
    paths:
      - 'crates/tier-5-node/celestia-rs/src/bridge/**'
      - 'crates/tier-5-node/celestia-rs/src/bridge.rs'
      - 'conformance/da/light/**'
      - 'conformance/da/peer/nat/**'
      - '.github/workflows/da-light-interop.yml'
permissions:
  contents: read

# Cancel superseded runs on the same PR. Other runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        revision: [d5dfb21a0885622828e30e8e2daf50e5d1bb72b2, af9897bb471959660a4179048656694f3013b2f5]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: celestiaorg/celestia-app
          ref: 58be8ae90d00518800df5506b3a1e988f009c1c6
          path: go-app
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: celestiaorg/celestia-node
          ref: ${{ matrix.revision }}
          path: go-node
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-node/go.mod
          cache-dependency-path: |
            go-app/go.sum
            go-node/go.sum
      - run: cargo build --locked -p celestia-rs --no-default-features --features da-light,da-webrtc,da-webtransport
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
      - name: Build the release network probe
        run: (cd go-node && go build -o "$RUNNER_TEMP/nat-probe" ../conformance/da/peer/nat/dialback.go)
      - name: Verify DA listeners through an isolated Internet Gateway Device
        run: |
          pkg="$RUNNER_TEMP/da-igd"
          mkdir -p "$pkg"
          (cd "$pkg" && apt-get download miniupnpd-iptables libip4tc2 libip6tc2 && for deb in *.deb; do dpkg-deb -x "$deb" root; done)
          for protocol in igd nat-pmp; do
            sudo unshare --net conformance/da/peer/nat/test-gateway.sh target/debug/celestia-rs "$RUNNER_TEMP/nat-probe" "$pkg/root" "$protocol"
          done
      - run: DA_TEST_RUST="$GITHUB_WORKSPACE/target/debug/celestia-rs" go test -v "$GITHUB_WORKSPACE/conformance/da/light/trust_test.go"
        working-directory: go-node
      - name: Install the locked browser interoperability client
        working-directory: conformance/da/peer/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: conformance/da/light/test-go-bridge.sh target/debug/celestia-rs go-app go-node
        env:
          DA_TEST_BROWSER: "1"
          DA_TEST_WEBTRANSPORT: "1"
          DA_TEST_WEBRTC: "1"
          DA_QUALIFICATION_SECONDS: ${{ inputs.observer_seconds || '10' }}
      - name: Check real Go AutoNAT dial-backs with private routing
        run: |
          sudo unshare --net conformance/da/peer/nat/test-routed.sh target/debug/celestia-rs "$RUNNER_TEMP/nat-probe"
