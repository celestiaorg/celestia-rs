name: soak-client-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR. Pushes to branches get a unique group
# (run_id), so post-merge runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<51'
      - run: python -m unittest discover -s conformance/devnet/soak -p 'test_*.py' -v

  provider-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/provider-client/go.mod
          cache-dependency-path: conformance/provider-client/go.sum
      - run: go test -race -count=1 ./...
        working-directory: conformance/provider-client
