name: soak-client-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<51'
      - run: python -m unittest discover -s conformance/devnet/soak -p 'test_*.py' -v
