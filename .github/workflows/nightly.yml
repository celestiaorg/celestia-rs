name: nightly

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      soak_secs:
        description: "Soak duration in seconds (conformance/devnet/soak.sh)"
        default: "1800"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  GOFLAGS: -mod=mod
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # RustSec advisories against the current Cargo.lock, every day: a new
  # advisory fails this job even when no commit touched the dependencies
  # (ci.yml's `deny` job only runs on push). Accepted advisories are the
  # `ignore` list of deny.toml (reasons in docs/security.md).
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features

  # Go binaries for the devnet scripts (celestia-app v10.5.0 / celestia-core
  # v0.42.3, and celestia-app v9.0.8 in v9/), built from module-proxy
  # sources and cached by version.
  devnet-bins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/devnet-oracle/go.mod
          cache-dependency-path: conformance/devnet-oracle/go.sum
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/devnet-bin
          key: devnet-bin-app-v10.5.0-v9.0.8-core-v0.42.3-${{ hashFiles('conformance/devnet/build-bins.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          conformance/devnet/build-bins.sh
          APP_VERSION=v9.0.8 APPD_ONLY=1 DEVNET_BIN=target/devnet-bin/v9 conformance/devnet/build-bins.sh
      - uses: actions/upload-artifact@v7
        with:
          name: devnet-bin
          path: target/devnet-bin
          retention-days: 2

  # The cheap live interop scripts (each a few minutes): Rust P2P, CAT
  # mempool, state sync and block sync against Go nodes, the mixed
  # validator set (M9), live double-sign evidence and Go's CLI against the
  # Rust node's RPC and gRPC.
  devnet-interop:
    needs: devnet-bins
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        script:
          - p2p-interop.sh
          - mempool-interop.sh
          - statesync-rust.sh conformance/devnet/workloads/staking.sh
          - APP_V9=1 statesync-rust.sh conformance/devnet/workloads/staking.sh
          - blocksync-interop.sh
          - mixed-validators.sh 60 20
          - double-sign-evidence.sh
          - rpc-cli.sh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: devnet-bin
          path: target/devnet-bin
      - run: chmod -R +x target/devnet-bin
      - name: Run ${{ matrix.script }}
        env:
          DEVNET_BIN: ${{ github.workspace }}/target/devnet-bin
          DEVNET_PORT_OFFSET: "15000"
          BLOCKS: "100"
          TMPDIR: ${{ runner.temp }}/devnet
        run: |
          mkdir -p "$TMPDIR"
          # leading NAME=value words are the script's environment
          set -- ${{ matrix.script }}
          envs=()
          while [[ "$1" == *=* ]]; do envs+=("$1"); shift; done
          env "${envs[@]}" bash "conformance/devnet/$1" "${@:2}"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/devnet
          retention-days: 7

  # Mixed Go / Rust network under load with chaos (kills, partitions,
  # latency, state-sync restarts, validator set changes).
  soak:
    needs: devnet-bins
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: devnet-bin
          path: target/devnet-bin
      - run: chmod -R +x target/devnet-bin
      - name: soak
        env:
          DEVNET_BIN: ${{ github.workspace }}/target/devnet-bin
          SOAK_SECS: ${{ github.event.inputs.soak_secs || '1800' }}
          SOAK_MIN_HEIGHTS: "300"
          SOAK_DIR: ${{ runner.temp }}/soak
        run: bash conformance/devnet/soak.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report
          path: |
            ${{ runner.temp }}/soak/report.*
            ${{ runner.temp }}/soak/*.csv
            ${{ runner.temp }}/soak/events.log
          retention-days: 14

  # Differential fuzzing against the pinned Go implementations
  # (crates/fuzz-diff vs conformance/fuzzoracle: celestia-app v10.5.0 and
  # v9.0.8), bounded in time. A mismatch fails the job and uploads the
  # inputs with both outcomes; docs/security.md ("Fuzzing").
  fuzz-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/fuzzoracle/v10/go.mod
          cache-dependency-path: conformance/fuzzoracle/*/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Go oracles
        run: |
          mkdir -p target/fuzzoracle
          for v in v9 v10; do
            (cd conformance/fuzzoracle/$v && go build -o "$GITHUB_WORKSPACE/target/fuzzoracle/fuzzoracle-$v" .)
          done
      - run: cargo build --release -p fuzz-diff
      - name: Differential runs
        run: |
          set -e
          seed=${{ github.run_number }}
          for v in 10 9; do
            target/release/fuzz-diff --app-version $v --ops tx,blobtx,iw,fibre --iters 1000000000 --max-secs 900 --seed $seed --findings findings
            target/release/fuzz-diff --app-version $v --ops eds --batch 64 --iters 1000000000 --max-secs 600 --seed $seed --findings findings
          done
      # The legacy amino JSON codec serves the TxEncodeAmino / TxDecodeAmino
      # queries only (no consensus path): its remaining differences (Go JSON
      # syntax error texts from go-amino's internal re-decoding, two Go
      # reflect panics; docs/security.md) are reported without failing the
      # job, so consensus findings above are not masked by them.
      - name: Differential runs (amino query codec, non-blocking)
        continue-on-error: true
        run: |
          seed=${{ github.run_number }}
          target/release/fuzz-diff --app-version 10 --ops amino_dec,amino_enc --iters 1000000000 --max-secs 300 --seed $seed --findings findings-amino
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-diff-findings
          path: |
            findings
            findings-amino
          if-no-files-found: ignore
          retention-days: 14

  # Crash-only libFuzzer targets (fuzz/, cargo-fuzz on nightly Rust): panics,
  # stack overflows, OOM (> 2 GB) and timeouts from untrusted input.
  cargo-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: txdecode, features: "" }
          - { target: amino, features: "" }
          - { target: square, features: "" }
          - { target: shares_parse, features: "" }
          - { target: abci_frame, features: abci }
          - { target: p2p_handshake, features: net }
          - { target: mconn_recv, features: net }
          - { target: p2p_msgs, features: net }
          - { target: light_json, features: rpc }
          - { target: rpc_request, features: rpc }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Keep discoveries across runs, separately from the checked-in seeds.
      # The run suffix makes each save immutable; the prefix restores the latest.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus-cache/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ runner.os }}-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        run: |
          features=""
          if [ -n "${{ matrix.features }}" ]; then features="--features ${{ matrix.features }}"; fi
          mkdir -p fuzz/corpus/${{ matrix.target }}
          mkdir -p fuzz/corpus-cache/${{ matrix.target }} ${{ runner.temp }}/fuzz-metrics
          rustc -Vv > ${{ runner.temp }}/fuzz-metrics/toolchain.txt
          cargo fuzz --version >> ${{ runner.temp }}/fuzz-metrics/toolchain.txt
          # Capture failure status even through tee; do not turn a crash green.
          set +e
          cargo fuzz run --sanitizer none $features ${{ matrix.target }} \
            fuzz/corpus-cache/${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=600 -rss_limit_mb=2048 -timeout=30 -print_final_stats=1 \
            2>&1 | tee ${{ runner.temp }}/fuzz-metrics/fuzz.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ${{ runner.temp }}/fuzz-metrics/exit-code
          exit "$rc"
      - name: Record fuzz evidence
        if: always()
        run: >-
          python3 scripts/quality/fuzz_stats.py '${{ matrix.target }}'
          --out ${{ runner.temp }}/fuzz-metrics --corpus fuzz/corpus-cache/${{ matrix.target }}
          --budget-seconds 600
      - if: always()
        run: test ! -f ${{ runner.temp }}/fuzz-metrics/metrics.md || cat ${{ runner.temp }}/fuzz-metrics/metrics.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: success()
        with:
          path: fuzz/corpus-cache/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-fuzz-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/fuzz-metrics
            fuzz/artifacts
            fuzz/Cargo.lock
            fuzz/corpus-cache/${{ matrix.target }}
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Compute coverage
        run: |
          mkdir -p ${{ runner.temp }}/quality
          rustc -Vv > ${{ runner.temp }}/quality/toolchain.txt
          cargo llvm-cov --workspace --all-features --locked --json --output-path ${{ runner.temp }}/quality/llvm.json
      - name: Report coverage and check budgets
        run: >-
          python3 scripts/quality/coverage.py ${{ runner.temp }}/quality/llvm.json
          --policy scripts/quality/coverage-budgets.json --out ${{ runner.temp }}/quality --require-all
          --suite 'cargo llvm-cov --workspace --all-features --locked'
      - name: Annotated source report
        run: cargo llvm-cov report --html --output-dir ${{ runner.temp }}/quality/html
      - if: always()
        run: test ! -f ${{ runner.temp }}/quality/coverage.md || cat ${{ runner.temp }}/quality/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-coverage
          path: ${{ runner.temp }}/quality
          retention-days: 30

  # Scheduled runs only (manual runs report to whoever started them): a
  # failure opens a `nightly-failure` issue with the failed jobs and their
  # log tails (or comments on the open one, so a red streak stays one
  # thread) and posts to #protocol-ci; the next green nightly closes it.
  report:
    needs: [advisories, devnet-bins, devnet-interop, soak, fuzz-diff, cargo-fuzz, coverage]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Open, update or close the nightly-failure issue
        id: issue
        run: |
          set -euo pipefail
          label=nightly-failure
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$FAILED" != true ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Nightly [#${{ github.run_number }}]($RUN_URL) passed on \`${GITHUB_SHA::7}\`."
            fi
            exit 0
          fi

          body=$(mktemp)
          {
            echo "Nightly [#${{ github.run_number }}]($RUN_URL) failed on \`$GITHUB_SHA\` ($(date -u +%F))."
            echo
            echo "| Job | Result | Failed step |"
            echo "| --- | --- | --- |"
            gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                    | "| [\(.name)](\(.html_url)) | \(.conclusion) | \([.steps[]? | select(.conclusion == "failure") | .name] | join(", ")) |"'
            echo
            # Log excerpt of each failed job (ANSI colours, timestamps and
            # runner cleanup stripped): 60 lines from the first failure marker
            # (coded rustc / cargo-deny diagnostic, panic, failed test,
            # libFuzzer crash), or the last 40 lines when there is none.
            gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r id name; do
              log=$(mktemp)
              gh api "repos/$GH_REPO/actions/jobs/$id/logs" 2>/dev/null |
                sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9T:.-]+Z //' |
                grep -vE '^(\[command\]|Post job cleanup|Cleaning up orphan|Removing |Temporarily overriding|Adding repository directory|includeif\.|git version|/home/runner|/github/)' |
                cut -c1-300 > "$log" || true
              first=$(grep -nm1 -E '^error\[|panicked at|\.\.\. FAILED|==[0-9]+== ?ERROR|^ERROR: libFuzzer' "$log" | cut -d: -f1 || true)
              echo "<details><summary>${name}: log excerpt</summary>"
              echo
              echo '```'
              if [ ! -s "$log" ]; then echo "(log unavailable)"
              elif [ -n "$first" ]; then tail -n "+$first" "$log" | head -n 60
              else tail -n 40 "$log"; fi
              echo '```'
              echo
              echo '</details>'
              echo
            done
          } > "$body"
          # GitHub caps issue and comment bodies at 65536 characters.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > "$body.cut"
            printf '\n```\n\n(truncated; full logs in the run)\n' >> "$body.cut"
            mv "$body.cut" "$body"
          fi

          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
            url=$(gh issue view "$open" --json url --jq .url)
          else
            gh label create "$label" --color B60205 --description "Scheduled nightly workflow failed" --force
            url=$(gh issue create --title "Nightly failed ($(date -u +%F))" --label "$label" --body-file "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Notify #protocol-ci
        if: always() && env.FAILED == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.PROTOCOL_CI_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('{0} | nightly failed on {1}: {2} (issue: {3})', github.repository, github.ref_name, env.RUN_URL, steps.issue.outputs.url || 'not created')) }}
            }
