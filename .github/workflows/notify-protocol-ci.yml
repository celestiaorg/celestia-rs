name: Notify protocol-ci on failure

# Posts a message to the #protocol-ci Slack channel when a CI workflow fails on
# the default branch (post-merge) or on a scheduled run. A single
# workflow_run-triggered file watches several workflows so we don't have to add
# a notify job to each one. The repo name is included in the message so
# #protocol-ci can aggregate failures across Protocol repos.
on:
  workflow_run:
    workflows:
      - "ci"
      - "oracle-build-tests"
      - "soak-client-tests"
      - "static analysis"
      - "determinism"
      - "fuzz-exec"
      - "fuzz (AddressSanitizer)"
      - "install"
      - "auto-update-tests"
      - "Signed commit helper tests"
      - "release"
    types:
      - completed
    branches:
      - main

# The notifier only calls an external Slack webhook; it needs no GITHUB_TOKEN
# scopes.
permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Filter on event so a fork PR whose branch shares the default branch's
    # name does not trigger a notification.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'schedule') }}
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.PROTOCOL_CI_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('{0} | {1} failed on {2}: {3}', github.repository, github.event.workflow_run.name, github.event.workflow_run.head_branch, github.event.workflow_run.html_url)) }}
            }

  # A scheduled workflow that fails every night is easy to miss in Slack.
  # Keep one open issue per workflow and add a comment for each failed run.
  scheduled-failure-issue:
    name: Track scheduled failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'schedule' &&
          (github.event.workflow_run.name == 'determinism' ||
           github.event.workflow_run.name == 'fuzz-exec') }}
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Scheduled ${WORKFLOW} is failing"
          body="Run ${RUN_URL} failed on main at ${HEAD_SHA}."
          number=$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body Later failures are added as comments; close this issue when the workflow is green again."
          fi
