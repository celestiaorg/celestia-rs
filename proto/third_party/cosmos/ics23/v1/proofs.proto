// cosmos/ics23 proofs.proto (github.com/cosmos/ics23/go v0.11.0), field
// layout reconstructed from the Go module's registered file descriptor
// (comments omitted). These types are mapped to the `ics23` crate via prost
// `extern_path`, so no Rust code is generated from this file; the schema is
// needed for wire-level validation (`wire_table.rs`).
syntax = "proto3";
package cosmos.ics23.v1;

option go_package = "github.com/cosmos/ics23/go;ics23";

enum HashOp {
  NO_HASH     = 0;
  SHA256      = 1;
  SHA512      = 2;
  KECCAK256   = 3;
  RIPEMD160   = 4;
  BITCOIN     = 5;
  SHA512_256  = 6;
  BLAKE2B_512 = 7;
  BLAKE2S_256 = 8;
  BLAKE3      = 9;
}

enum LengthOp {
  NO_PREFIX        = 0;
  VAR_PROTO        = 1;
  VAR_RLP          = 2;
  FIXED32_BIG      = 3;
  FIXED32_LITTLE   = 4;
  FIXED64_BIG      = 5;
  FIXED64_LITTLE   = 6;
  REQUIRE_32_BYTES = 7;
  REQUIRE_64_BYTES = 8;
}

message ExistenceProof {
  bytes            key   = 1;
  bytes            value = 2;
  LeafOp           leaf  = 3;
  repeated InnerOp path  = 4;
}

message NonExistenceProof {
  bytes          key   = 1;
  ExistenceProof left  = 2;
  ExistenceProof right = 3;
}

message CommitmentProof {
  oneof proof {
    ExistenceProof       exist      = 1;
    NonExistenceProof    nonexist   = 2;
    BatchProof           batch      = 3;
    CompressedBatchProof compressed = 4;
  }
}

message LeafOp {
  HashOp   hash          = 1;
  HashOp   prehash_key   = 2;
  HashOp   prehash_value = 3;
  LengthOp length        = 4;
  bytes    prefix        = 5;
}

message InnerOp {
  HashOp hash   = 1;
  bytes  prefix = 2;
  bytes  suffix = 3;
}

message ProofSpec {
  LeafOp    leaf_spec                     = 1;
  InnerSpec inner_spec                    = 2;
  int32     max_depth                     = 3;
  int32     min_depth                     = 4;
  bool      prehash_key_before_comparison = 5;
}

message InnerSpec {
  repeated int32 child_order       = 1;
  int32          child_size        = 2;
  int32          min_prefix_length = 3;
  int32          max_prefix_length = 4;
  bytes          empty_child       = 5;
  HashOp         hash              = 6;
}

message BatchProof {
  repeated BatchEntry entries = 1;
}

message BatchEntry {
  oneof proof {
    ExistenceProof    exist    = 1;
    NonExistenceProof nonexist = 2;
  }
}

message CompressedBatchProof {
  repeated CompressedBatchEntry entries       = 1;
  repeated InnerOp              lookup_inners = 2;
}

message CompressedBatchEntry {
  oneof proof {
    CompressedExistenceProof    exist    = 1;
    CompressedNonExistenceProof nonexist = 2;
  }
}

message CompressedExistenceProof {
  bytes          key   = 1;
  bytes          value = 2;
  LeafOp         leaf  = 3;
  repeated int32 path  = 4;
}

message CompressedNonExistenceProof {
  bytes                    key   = 1;
  CompressedExistenceProof left  = 2;
  CompressedExistenceProof right = 3;
}
