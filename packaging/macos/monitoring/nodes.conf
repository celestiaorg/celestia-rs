# Nodes for node-metrics.sh: <network> <home> <local-rpc> <reference-rpc>
# [<log file>]. `network` must match the label in prometheus.yml. The
# reference RPC is a Go node that check-apphash.sh compares app hashes
# with. The log file (the launchd job's StandardErrorPath) is scanned for
# double-sign-guard refusals. install.sh replaces __HOME__ with $HOME.
mocha   __HOME__/.celestia-rs/mocha   http://127.0.0.1:26657 https://rpc.celestia-mocha.com      __HOME__/Library/Logs/celestia-rs.log
mainnet __HOME__/.celestia-rs/mainnet http://127.0.0.1:26757 https://celestia-rpc.publicnode.com __HOME__/Library/Logs/celestia-rs-mainnet.log
