# Nodes for node-metrics.sh: <network> <home> <local-rpc> <reference-rpc>
# [<log file> [<valoper>]]. `network` must match the label in
# prometheus.yml. The reference RPC is a Go node that check-apphash.sh
# compares app hashes with. The log file (the launchd job's
# StandardErrorPath, `-` for none) is scanned for double-sign-guard
# refusals. The valoper is the validator's operator address, whose
# x/staking jailed flag is celestia_rs_validator_jailed; without it that
# metric is absent and ValidatorJailedUnknown fires. install.sh replaces
# __HOME__ with $HOME.
mocha   __HOME__/.celestia-rs/mocha   http://127.0.0.1:26657 https://rpc.celestia-mocha.com      __HOME__/Library/Logs/celestia-rs.log         celestiavaloper13v73gcz3k923ajt23alr5h3wuvsgqxu3jag0sd
mainnet __HOME__/.celestia-rs/mainnet http://127.0.0.1:26757 https://celestia-rpc.publicnode.com __HOME__/Library/Logs/celestia-rs-mainnet.log celestiavaloper16v6qxgj2w996jt49tngf9fkvxw6j7u0uh6d9ec
