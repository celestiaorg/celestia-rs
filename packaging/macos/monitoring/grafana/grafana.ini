; Grafana for the celestia-rs nodes (packaging/macos/monitoring/README.md).
; install.sh renders __MON__ (~/.celestia-rs/monitoring) and __ROOT_URL__.
; Grafana listens on loopback only; `tailscale serve` publishes it on the
; tailnet over HTTPS.

[paths]
data = __MON__/grafana/data
logs = __MON__/logs
plugins = __MON__/grafana/plugins
provisioning = __MON__/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = __ROOT_URL__

[security]
admin_user = admin
admin_password = $__file{__MON__/grafana/admin-password}
cookie_secure = true

; Anyone on the tailnet can view (not edit) dashboards without logging in.
[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = __MON__/grafana/dashboards/celestia-rs.json

; launchd/supervise.sh already send stdout to logs/grafana.log.
[log]
mode = console

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

